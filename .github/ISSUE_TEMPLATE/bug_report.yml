name: Bug Report
description: File a bug report
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thank you for taking the time to file a bug report!"
  - type: input
    attributes:
      label: Version
      description: "e.g. 1.2.3 or 'main'"
      placeholder: "1.2.3"
  - type: input
    attributes:
      label: OS
      description: "e.g. Windows 11, Ubuntu 22.04, macOS 13"
      placeholder: "e.g. Ubuntu 22.04"
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: "Steps that reproduce the issue"
      placeholder: "1. Open note... 2. ..."
  - type: textarea
    attributes:
      label: Expected behavior
      description: "What should happen"
      placeholder: "e.g. The note opens and is editable"
  - type: textarea
    attributes:
      label: Actual behavior
      description: "What actually happens"
      placeholder: "e.g. The app crashes on launch"